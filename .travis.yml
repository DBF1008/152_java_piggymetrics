dist: trusty
sudo: required

services:
  - docker

language: java
jdk: oraclejdk8

env:
  global:
    - secure: "" # DOCKER_EMAIL
    - secure: "" # DOCKER_USER
    - secure: "" # DOCKER_PASS
    - COMMIT=${TRAVIS_COMMIT::7}

before_script:
  # Guard the publish manifest before anything is built or pushed.
  - bash scripts/check-manifest.sh

after_success:
  - bash <(curl -s https://codecov.io/bash)
  - docker login -u $DOCKER_USER -p $DOCKER_PASS

  # Build, tag (by commit + branch) and push every image in the manifest.
  # The full publish list lives in scripts/publish-manifest.txt.
  - bash scripts/publish-images.sh
